name: realworld-e2e
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: isolated-test-root
      MYSQL_DATABASE: realworld_test
      MYSQL_USER: realworld_test
      MYSQL_PASSWORD: isolated-test-password
    ports:
      - '127.0.0.1:13306:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pisolated-test-root']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:16379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
